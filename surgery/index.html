<body>
<title>Surgery Supplement Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column. Surgery countdown, week strip of progress rings, the day's to-do and done lists grouped by dose time, and a bottom bar for Today / Supplements / Progress. */
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --band:#FAF9F6; --line:#ECE9E2; --ink:#1E1E1B; --ink2:#4A4843; --muted:#6E6B63;
  --track:#E6E3DB; --chk:#949086; --tile:#F1EFE9;
  --accent:#5F9C74; --accent-ink:#3D7552; --accent-tint:#E4EEE6; --on-accent:#FFFFFF;
  --special:#B4651F; --special-tint:#F5E4D2;
  --font:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --card:#1F1F1C; --band:#232320; --line:#2F2E2A; --ink:#F2F0EB; --ink2:#D2CFC7; --muted:#A3A097;
    --track:#36352F; --chk:#6E6C64; --tile:#2A2926;
    --accent:#7DBE92; --accent-ink:#93CFA6; --accent-tint:#203327; --on-accent:#10140F;
    --special:#E9A564; --special-tint:#3B2A1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --card:#1F1F1C; --band:#232320; --line:#2F2E2A; --ink:#F2F0EB; --ink2:#D2CFC7; --muted:#A3A097;
  --track:#36352F; --chk:#6E6C64; --tile:#2A2926;
  --accent:#7DBE92; --accent-ink:#93CFA6; --accent-tint:#203327; --on-accent:#10140F;
  --special:#E9A564; --special-tint:#3B2A1A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(84px + env(safe-area-inset-bottom,0px))}

/* Countdown */
.cd{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.cd .tile{background:var(--special-tint);color:var(--special)}
.cd-t{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cd-n{font-size:22px;font-weight:800;line-height:1.1;color:var(--special);font-variant-numeric:tabular-nums}
.cd-l{font-size:15px;font-weight:600}
.cd-s{font-size:13px;color:var(--muted);margin-top:1px}

/* Week strip */
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:10px}
.strip::-webkit-scrollbar{display:none}
.week{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.d{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 6px;border-radius:16px;text-align:center}
.d .wd{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.d.today .wd{color:var(--accent-ink)}
.d[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d[aria-pressed="true"] .wd{color:var(--ink);font-weight:800}
.d[aria-pressed="true"] .n{font-weight:800}
.ring{position:relative;width:34px;height:34px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--track);stroke-width:3}
.ring .p{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .25s}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mk{height:12px;display:grid;place-items:center;color:var(--special)}
.mk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.d.sp .ring .t{stroke:var(--special-tint)}
.d.sp .ring .p{stroke:var(--special)}
.d.sp .n{color:var(--special);font-weight:800}
.dots{display:flex;justify-content:center;gap:5px;margin-top:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--muted)}

/* Day summary */
.dateline{margin-top:12px;font-size:15px;color:var(--muted)}
.dateline b{font-weight:600;color:var(--special)}
.counter{display:flex;align-items:baseline;gap:8px;margin-top:2px;flex-wrap:wrap}
.big{font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.of{font-size:30px;font-weight:600;line-height:1.15;color:var(--track);font-variant-numeric:tabular-nums}
.of b{color:var(--muted);font-weight:600}
.lbl{font-size:15px;color:var(--muted)}

.sec{display:flex;gap:8px;align-items:baseline;margin:20px 2px 8px;font-size:16px;font-weight:600}
.sec span{color:var(--muted);font-weight:500}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.band{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 14px;background:var(--band);font-size:12px;font-weight:700;color:var(--muted)}
.band span{font-weight:500}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:64px}
.tile{flex:none;width:42px;height:42px;border-radius:12px;background:var(--tile);display:grid;place-items:center;color:var(--ink2)}
.tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile{overflow:hidden}
.tile img{display:block;width:auto;height:auto;max-width:34px;max-height:37px;object-fit:contain}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{font-size:15px;font-weight:500;line-height:1.25}
.sb{font-size:14px;color:var(--muted)}
.pill{align-self:flex-start;margin-top:5px;font-size:12px;font-weight:600;color:var(--ink2);border:1.5px solid var(--line);border-radius:999px;padding:2px 9px}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--chk);display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.chk svg{width:13px;height:13px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item[aria-checked="true"] .chk{background:var(--accent);border-color:var(--accent)}
.item[aria-checked="true"] .chk svg{opacity:1}
.item[aria-checked="true"] .nm{color:var(--muted)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:16px}
.empty{display:flex;align-items:center;gap:10px;padding:16px 14px;color:var(--muted)}
.empty .chk{background:var(--accent);border-color:var(--accent)}
.empty .chk svg{opacity:1}

/* Other views */
.vt{margin:12px 2px 0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.grp{margin-top:20px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 2px 8px}
.gh b{font-size:16px;font-weight:700}
.gh span{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.gh.sp b,.gh.sp span{color:var(--special)}
.foot{margin:14px 4px 0;font-size:13px;line-height:1.5;color:var(--muted)}

.cal{padding:12px 8px 8px}
.cal-h,.cal-r{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;justify-items:center}
.cal-h span{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cal-c{margin:10px 6px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.cal-r .d{padding:4px 0 2px;gap:2px;width:100%}
.cal-r .ring{width:32px;height:32px}
.cal-r .ring .n{font-size:13px}
.cal-r .d.today .n{color:var(--accent-ink);font-weight:800}
.sync{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.bar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600;text-align:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink)}

@media (prefers-reduced-motion: reduce){ .ring .p,.chk{transition:none} }
</style>

<div class="wrap">
  <section id="v-today" aria-label="Today">
    <div id="cd"></div>
    <div class="strip" id="strip" aria-label="Choose a day"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div id="day"></div>
  </section>
  <section id="v-supps" aria-label="Supplements" hidden></section>
  <section id="v-progress" aria-label="Progress" hidden></section>
</div>

<nav class="bar" aria-label="Views">
  <div class="bar-in">
    <button type="button" class="tab" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Today
    </button>
    <button type="button" class="tab" data-view="supps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/></svg>Supplements
    </button>
    <button type="button" class="tab" data-view="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress
    </button>
  </div>
</nav>

<script>
(function () {
  "use strict";

  /* ---------- Dates ---------- */
  const MS = 86400000;
  const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const add = (d, n) => { const x = sod(d); x.setDate(x.getDate() + n); return x; };
  const diff = (a, b) => Math.round((sod(a) - sod(b)) / MS);
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const fmt = (d, o) => d.toLocaleDateString("en-US", o);
  const fLong = (d) => fmt(d, { weekday: "short", month: "short", day: "numeric" });
  const fShort = (d) => fmt(d, { month: "short", day: "numeric" });

  const DAY1 = new Date(2026, 9, 19);   // Monday, first prep day
  const DAYS = 35;                       // 5 weeks, through Sun Nov 22
  const NIGHT_N = 13, SURG_N = 14;       // Sun Nov 1, Mon Nov 2
  const dateOf = (n) => add(DAY1, n);
  const TODAY = sod(new Date());
  const todayN = diff(TODAY, DAY1);
  let sel = Math.min(Math.max(todayN, 0), DAYS - 1);
  let view = "today";

  /* ---------- Icons ---------- */
  const IC = {
    capsule: '<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
    tablet: '<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/>',
    spoon: '<ellipse cx="12" cy="7.5" rx="3.6" ry="4.6"/><path d="M12 12.1V21"/>',
    pump: '<path d="M8.5 10h7v10a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 8.5 20Z"/><path d="M10.5 10V7h3v3"/><path d="M12 7V4h4.5"/>',
    drops: '<path d="M8 11h8v9.5a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 8 20.5Z"/><path d="M10 11V8h4v3"/><path d="M11 8V4.5a1 1 0 0 1 2 0V8"/>',
    swab: '<path d="M8 16 16 8"/><ellipse cx="17.5" cy="6.5" rx="1.9" ry="3" transform="rotate(45 17.5 6.5)"/><ellipse cx="6.5" cy="17.5" rx="1.9" ry="3" transform="rotate(45 6.5 17.5)"/>',
    tooth: '<path d="M8 3.5C5.5 3.5 4 5.4 4 8c0 2 .8 3.4 1.3 5.3.6 2.3.8 7.2 2.7 7.2 1.7 0 1.6-4.6 4-4.6s2.3 4.6 4 4.6c1.9 0 2.1-4.9 2.7-7.2.5-1.9 1.3-3.3 1.3-5.3 0-2.6-1.5-4.5-4-4.5-1.8 0-2.6 1-4 1s-2.2-1-4-1Z"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'

  function itemsFor(n) {

  function phaseOf(n) {
    if (n < NIGHT_N) return "Prep day " + (n + 1) + " of 14";

    if (n === SURG_N) return "<b>Surgery day</b>";

  function renderCountdown() {

  }

  /* ---------- Rings ---------- */

      '<circle class="p" data-c="' + C.toFixed(2) + '" cx="' + c + '" cy="' + c + '" r="' + r + '" stroke-dasharray="' + (p * C).toFixed(2) + ' ' + C.toFixed(2) + '"' + (p === 0 ? ' style="opacity:0"' : '') + '/>' +

        infoRow("capsule", "Bone Builder Plus", "Per bottle · start now"),
        infoRow("capsule", "D3K2", "20,000 IU a day"),
        infoRow("drops", "Bio-D-Mulsion Forte", "2 drops (4,000 IU) a day", "From the bottle label"),
        infoRow("spoon", "Vitamin C", "3 tsp (3.5 g) a day", "Refrigerate after opening"),
        infoRow("capsule", "Magnesium glycinate", "300 µg, morning and evening", "Sheet says ug, likely mg"),
        infoRow("capsule", "Methyl-B12", "Per bottle"),
        infoRow("capsule", "PhytoMulti", "Once a day")
      ]) +
      grp("Night before", fLong(dateOf(NIGHT_N)), [
        infoRow("pump", "GABA", "1 pump"),
        infoRow("pump", "CBD", "1 pump"),
        infoRow("pump", "Relax Milieu", "1 pump · blue bottle")
      ], true) +
      grp("Surgery day", fLong(dateOf(SURG_N)), [
        infoRow("pump", "GABA", "1 pump, 1 hour before"),
        infoRow("pump", "CBD", "1 pump, 1 hour before"),
        infoRow("pump", "Relax Milieu", "1 pump, 1 hour before"),
        infoRow("tablet", "Halcion", "As directed by the office"),
        infoRow("tablet", "Intenzyme Forte", "10 tablets")
      ], true) +
      grp("Recovery", "From " + fShort(dateOf(SURG_N + 1)), [
        infoRow("tablet", "Intenzyme Forte", "10 tablets the day after, then every other day until gone", "50 tablets: last dose " + fShort(dateOf(INTZ_LAST_N))),
        infoRow("drops", "Drainage Milieu", "Per bottle until empty"),
        infoRow("drops", "Lymph 3 Chronic", "Per bottle until empty"),
        infoRow("swab", "Renew silver gel", "Q-tip around gums", "Gently, don’t dislodge the clot"),
        infoRow("capsule", "Bone Builder Plus", "Per bottle"),
        infoRow("capsule", "PhytoMulti", "Once a day")
      ]) +
      '<p class="foot">Ask the office whether D3K2, vitamin C, magnesium and B12 continue after surgery.</p>';
  }

  /* ---------- Progress view ---------- */
  let syncText = "Checkmarks are saved on this device.";
  function renderProgress() {
    const last = Math.min(todayN, DAYS - 1);
    let due = 0, taken = 0;
    for (let n = 0; n <= last; n++) { due += itemsFor(n).length; taken += doneCount(n); }
    const stat = todayN < 0
      ? '<div class="dateline">' + (todayN === -1 ? "Starts tomorrow" : "Starts " + fLong(DAY1)) + '</div>'
      : '<div class="counter" style="margin-top:8px"><span class="big">' + taken + '</span><span class="of"><b>/ ' + due + '</b></span><span class="lbl">doses so far</span></div>';
    let rows = "";
    for (let w = 0; w < DAYS / 7; w++) {
      if (w === 0) rows += '<div class="cal-c">Before surgery</div>';
      if (w === 2) rows += '<div class="cal-c">Surgery and recovery</div>';
      rows += '<div class="cal-r">';
      for (let i = 0; i < 7; i++) {
        const n = w * 7 + i;
        rows += '<button type="button" class="' + dayClass(n) + '" data-n="' + n + '" data-go="1" aria-label="' + dayLabel(n) + '">' + ring(n, 14) + marker(n) + '</button>';
      }
      rows += "</div>";
    }
    const heads = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => "<span>" + d + "</span>").join("");
    document.getElementById("v-progress").innerHTML =
      '<h1 class="vt">Progress</h1>' + stat +
      '<div class="list" style="margin-top:16px"><div class="cal"><div class="cal-h">' + heads + '</div>' + rows + '</div></div>' +
      '<p class="sync" id="sync">' + syncText + '</p>';
  }
  function setSync(t) { syncText = t; const el = document.getElementById("sync"); if (el) el.textContent = t; }

  /* ---------- Views ---------- */
  function showView(v) {
    view = v;
    document.querySelectorAll(".tab").forEach((t) => { if (t.dataset.view === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    document.getElementById("v-today").hidden = v !== "today";
    document.getElementById("v-supps").hidden = v !== "supps";
    document.getElementById("v-progress").hidden = v !== "progress";
    if (v === "supps") renderSupps();
    if (v === "progress") renderProgress();
    if (v === "today") showWeek();
    window.scrollTo(0, 0);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".tab, .item[data-k], .d");
    if (!t) return;
    if (t.classList.contains("tab")) { showView(t.dataset.view); return; }
    if (t.dataset.k) {
      const k = t.dataset.k, n = +t.dataset.n, hadFocus = document.activeElement === t;
      if (on(k)) delete state[k]; else state[k] = true;
      if (!synced) early[k] = on(k);
      saveLocal(); queueSync();
      renderDay(); updateRings(n);
      if (hadFocus) { const again = document.querySelector('.item[data-k="' + k + '"]'); if (again) again.focus(); }
      return;
    }
    if (t.dataset.go) { sel = +t.dataset.n; showView("today"); selectDay(sel); return; }
    selectDay(+t.dataset.n);
  });

  /* ---------- Sync across devices (db capability; falls back to this device) ---------- */
  let ref = null, synced = false, timer = null, pending = false;
  const early = {};
  function queueSync() {
    if (!ref) return;
    pending = true;
    clearTimeout(timer);
    timer = setTimeout(() => flush(false), 400);
  }
  async function flush(retried) {
    if (!ref) return;
    try { await ref.set(Object.assign({}, state)); pending = false; setSync("Checkmarks sync across your devices."); }
    catch (err) {
      if (err && err.code === "unavailable" && !retried) { setTimeout(() => flush(true), 600 + Math.random() * 900); return; }
      pending = false; setSync("Couldn’t sync just now. Checkmarks are saved on this device.");
    }
  }
  const clean = (o) => { const out = {}; if (o) Object.keys(o).forEach((k) => { if (o[k] === true) out[k] = true; }); return out; };
  function refreshAll() {
    for (let n = 0; n < DAYS; n++) updateRings(n);
    renderDay();
    if (view === "progress") renderProgress();
  }
  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return;
    try { ref = db.doc("tracker/state"); } catch (e) { ref = null; return; }
    ref.onSnapshot((snap) => {
      const remote = snap.exists ? clean(snap.data()) : null;
      if (!synced) {
        synced = true;
        state = remote || clean(state);
        Object.keys(early).forEach((k) => { if (early[k]) state[k] = true; else delete state[k]; });
        saveLocal(); refreshAll();
        setSync("Checkmarks sync across your devices.");
        if (!remote || Object.keys(early).length) queueSync();
        return;
      }
      if (pending) return;
      state = remote || {};
      saveLocal(); refreshAll();
    }, () => { ref = null; setSync("Checkmarks are saved on this device."); });
  }

  renderCountdown();
  renderStrip();
  renderDay();
  requestAnimationFrame(showWeek);
  connect();
})();
</script>
