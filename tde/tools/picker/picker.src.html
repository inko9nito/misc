<title>TDE Style Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the site fills the whole screen; one small floating switcher at the bottom that hides while you scroll down. Committed dark chrome so it reads over any style. */
:root {
  color-scheme: dark;
  --ink: #101014; --glass: rgba(20, 20, 26, 0.86); --glass-2: rgba(255, 255, 255, 0.08); --line: rgba(255, 255, 255, 0.14);
  --text: #f4f3f7; --dim: #a9a6b4; --hi: #ffffff; --accent: #ff4a4a;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 14px/1.35 var(--font-ui); overflow: hidden; }

.stage { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(var(--panes, 1), minmax(0, 1fr)); gap: 2px; background: var(--ink); }
.pane { position: relative; overflow: hidden; min-width: 0; background: #fff; }
.pane .frame { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
.pane .tag { position: absolute; z-index: 2; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--glass); color: var(--text); font: 600 12px var(--font-ui); padding: 6px 10px; border-radius: 999px; pointer-events: none; }
.stage:not(.two) .tag { display: none; }

/* Floating switcher */
.dock { position: fixed; z-index: 20; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); transition: transform 220ms cubic-bezier(.2,.7,.2,1), opacity 220ms; }
.dock.away { transform: translate(-50%, calc(100% + 30px)); opacity: 0; pointer-events: none; }
.bar { display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.bar button, .bar select { font: 500 14px var(--font-ui); color: var(--text); background: none; border: 0; border-radius: 999px; height: 40px; cursor: pointer; }
.bar button:hover, .bar select:hover { background: var(--glass-2); }
.bar :focus-visible, .sheet :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ico { width: 40px; display: inline-grid; place-items: center; font-size: 18px !important; flex: none; }
.cur { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 14px !important; min-width: 0; text-align: left; line-height: 1.15; }
.cur b { font-weight: 600; font-size: 14px; white-space: nowrap; }
.cur i { font-style: normal; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.sep { width: 1px; height: 24px; background: var(--line); flex: none; margin: 0 2px; }
.bar select { padding: 0 10px; appearance: none; -webkit-appearance: none; }
.bar select option { color: #000; }
.seg { display: inline-flex; background: var(--glass-2); border-radius: 999px; padding: 2px; }
.seg button { height: 36px; padding: 0 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--hi); color: #111; }

/* Style list, opens above the bar */
.sheet { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: min(720px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow: auto; padding: 8px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.item { display: grid; align-content: start; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; text-align: left; font: inherit; color: var(--text); background: none; border: 0; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.item:hover { background: var(--glass-2); }
.item[aria-current="true"] { background: var(--hi); color: #111; }
.item[aria-current="true"] small, .item[aria-current="true"] kbd { color: #55525e; }
.item kbd { grid-row: span 2; font: 500 12px var(--font-ui); color: var(--dim); padding-top: 2px; }
.item b { font-weight: 600; font-size: 14.5px; }
.item b span { font-weight: 400; color: inherit; opacity: 0.6; margin-left: 6px; font-size: 13px; }
.item small { font-size: 12.5px; color: var(--dim); line-height: 1.35; }
.sheet-ft { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px 4px; margin-top: 6px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12.5px; }
.sheet-ft select { font: 500 13px var(--font-ui); color: var(--text); background: var(--glass-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.sheet-ft select option { color: #000; }
.sheet-ft .keys { margin-left: auto; }

.peek { position: fixed; z-index: 19; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: 600 15px var(--font-ui); cursor: pointer; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

@media (max-width: 700px) {
  .wide-only { display: none !important; }
  .list { grid-template-columns: minmax(0, 1fr); }
  .sheet-ft .keys { display: none; }
  .cur { max-width: 44vw; }
  .cur b, .cur i { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .dock { transition: none; } }
</style>

<main class="stage" id="stage"></main>

<div class="dock" id="dock">
  <div class="sheet" id="sheet" hidden>
    <div class="list" id="list" role="listbox" aria-label="Styles"></div>
    <div class="sheet-ft">
      <label class="wide-only" for="cmp">Side by side with</label>
      <select class="wide-only" id="cmp"><option value="">Nothing</option></select>
      <span class="keys">← → or 1–0 to switch · H to hide</span>
    </div>
  </div>
  <div class="bar" role="toolbar" aria-label="Style switcher">
    <button class="ico" id="prev" aria-label="Previous style">‹</button>
    <button class="cur" id="cur" aria-haspopup="listbox" aria-expanded="false"><b id="cur-name"></b><i id="cur-after"></i></button>
    <button class="ico" id="next" aria-label="Next style">›</button>
    <span class="sep"></span>
    <select id="page" aria-label="Page">
      <option value="index.html">Home</option>
      <option value="event-dec-12.html">Event · 1 day</option>
      <option value="event-feb-6-7.html">Event · 2 days</option>
    </select>
    <span class="sep wide-only"></span>
    <div class="seg wide-only" id="dev" role="group" aria-label="Width">
      <button data-v="desktop" aria-pressed="true">Desktop</button>
      <button data-v="phone">Phone</button>
    </div>
    <button class="ico" id="hide" aria-label="Hide switcher">×</button>
  </div>
</div>
<button class="peek" id="peek" aria-label="Show style switcher" hidden>Aa</button>

<script type="application/json" id="site-data">/*SITE*/</script>
<script>
const RAW = JSON.parse(document.getElementById("site-data").textContent);
// Pages share one copy of the stylesheets and scripts; put them back in place here.
const SITE = Object.fromEntries(Object.entries(RAW.pages).map(([f, h]) => [f, h.replace(/@@([\w.-]+)@@/g, (_, n) => RAW.parts[n])]));
const OPTS = [
  { id: "a",        look: "",         name: "A · Precision", after: "after BMW M",       desc: "Square corners, Barlow type, deep-purple header, red accent. Closest to the handoff." },
  { id: "b",        look: "b",        name: "B · Porsche",   after: "after Porsche",     desc: "Inter Tight, 4px buttons, photo tiles with titles on them, segmented booking tabs." },
  { id: "athletic", look: "athletic", name: "Athletic",      after: "after Nike",        desc: "Condensed caps headlines, black pill buttons, red saved for Reserve." },
  { id: "showcase", look: "showcase", name: "Showcase",      after: "after Apple",       desc: "Centered dark hero with the photo below, soft gray fields, rounded white cards." },
  { id: "booking",  look: "booking",  name: "Booking",       after: "after Airbnb",      desc: "White header, rounded photo hero, raised price-first reserve card." },
  { id: "console",  look: "console",  name: "Console",       after: "after PlayStation", desc: "Black hero, thin headlines, pills that grow on hover, 24px cards, purple footer." },
  { id: "ledger",   look: "ledger",   name: "Ledger",        after: "after Stripe",      desc: "Diagonal purple-to-red gradient hero, light deep-purple headlines, tinted shadows." },
  { id: "ride",     look: "ride",     name: "Ride",          after: "after Uber",        desc: "Black and white pills, headline in a white panel over a full photo." },
  { id: "kit",      look: "kit",      name: "Kit",           after: "after Adidas",      desc: "Italic condensed caps, square everything, black buttons with an offset outline and arrow, yellow new-drivers band." },
  { id: "trail",    look: "trail",    name: "Trail",         after: "after Rivian",      desc: "Calm warm neutrals, full-bleed photo under the header, light Figtree type, pill buttons." }
];
const $ = s => document.querySelector(s);
const narrow = () => innerWidth <= 700;
const state = { opt: "a", cmp: "", page: "index.html", dev: "desktop" };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
try { Object.assign(state, JSON.parse(store.get("tde-picker2") || "{}")); } catch {}
if (!SITE[state.page]) state.page = "index.html";
if (!OPTS.some(o => o.id === state.opt)) state.opt = "a";
const fromHash = location.hash.slice(1); if (OPTS.some(o => o.id === fromHash)) state.opt = fromHash;

$("#list").innerHTML = OPTS.map((o, i) => `<button class="item" role="option" data-id="${o.id}"><kbd>${(i + 1) % 10}</kbd><b>${o.name}<span>${o.after}</span></b><small>${o.desc}</small></button>`).join("");
$("#cmp").innerHTML += OPTS.map(o => `<option value="${o.id}">${o.name}</option>`).join("");

const query = o => `?clean&today=2026-11-26${o.look ? `&look=${o.look}` : ""}`;
let pendingHash = "";

window.tdeNav = (file, hash) => {
  if (!SITE[file]) return;
  const id = hash.slice(1);
  if (file === state.page) { document.querySelectorAll(".frame").forEach(f => { try { const t = f.contentDocument.getElementById(id); t ? t.scrollIntoView() : f.contentWindow.scrollTo(0, 0); } catch {} }); return; }
  pendingHash = id; state.page = file; render();
};

// Hide the switcher while reading down the page; bring it back on any scroll up.
let lastY = 0;
function watchScroll(frame) {
  try {
    const w = frame.contentWindow;
    w.addEventListener("scroll", () => {
      const y = w.scrollY;
      if (Math.abs(y - lastY) < 8) return;
      if ($("#sheet").hidden) $("#dock").classList.toggle("away", y > lastY && y > 120);
      lastY = y;
    }, { passive: true });
  } catch {}
}

function render() {
  const ids = [state.opt, narrow() ? "" : state.cmp].filter((v, i, a) => v && a.indexOf(v) === i);
  const o = OPTS.find(x => x.id === state.opt);
  $("#cur-name").textContent = o.name; $("#cur-after").textContent = o.after;
  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.id === state.opt));
  document.querySelectorAll("#dev button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.dev));
  $("#page").value = state.page; $("#cmp").value = state.cmp;
  const stage = $("#stage"); stage.style.setProperty("--panes", ids.length); stage.classList.toggle("two", ids.length > 1);
  const slots = [...stage.children];
  ids.forEach((id, i) => {
    const opt = OPTS.find(x => x.id === id);
    let p = slots[i] && slots[i]._p;
    if (!p) {
      const el = document.createElement("section"); el.className = "pane";
      el.innerHTML = `<span class="tag"></span><iframe class="frame"></iframe>`;
      p = { el, frame: el.querySelector("iframe") }; el._p = p; stage.appendChild(el);
    }
    p.el.querySelector(".tag").textContent = opt.name;
    p.frame.title = `${opt.name} preview`;
    const key = state.page + query(opt);
    if (p.key !== key) {
      let keep = 0; if (p.page === state.page) { try { keep = p.frame.contentWindow.scrollY; } catch {} }
      p.key = key; p.page = state.page;
      const jump = pendingHash;
      p.frame.onload = () => { watchScroll(p.frame); try { const w = p.frame.contentWindow, t = jump && w.document.getElementById(jump); if (t) t.scrollIntoView(); else w.scrollTo(0, keep); } catch {} };
      p.frame.srcdoc = SITE[state.page].replaceAll("__TDE_Q__", query(opt));
    }
  });
  pendingHash = "";
  slots.slice(ids.length).forEach(s => s.remove());
  fit();
  history.replaceState(null, "", `#${state.opt}`);
  store.set("tde-picker2", JSON.stringify({ page: state.page, dev: state.dev, cmp: state.cmp }));
}

// Draw the page at its real width. Desktop never drops below 1280 (scaled down to fit);
// phone is 390 wide on a large screen and the true screen width on a phone.
function fit() {
  document.querySelectorAll(".pane").forEach(el => {
    const f = el.querySelector("iframe"), W = el.clientWidth, H = el.clientHeight;
    let w, s;
    if (narrow()) { w = W; s = 1; }
    else if (state.dev === "phone") { w = 390; s = Math.min(1, W / 390); }
    else { w = Math.max(W, 1280); s = W / w; }
    f.style.width = w + "px"; f.style.height = (H / s) + "px";
    f.style.left = Math.max(0, (W - w * s) / 2) + "px";
    f.style.transform = `scale(${s})`;
    el.style.background = (!narrow() && state.dev === "phone") ? "#1d1c22" : "#fff";
  });
}

function go(d) { const i = OPTS.findIndex(o => o.id === state.opt); state.opt = OPTS[(i + d + OPTS.length) % OPTS.length].id; if (state.cmp === state.opt) state.cmp = ""; render(); }
function toggleSheet(open = $("#sheet").hidden) { $("#sheet").hidden = !open; $("#cur").setAttribute("aria-expanded", open); if (open) { $("#dock").classList.remove("away"); document.querySelector('.item[aria-current="true"]')?.focus({ preventScroll: true }); } }
function setHidden(h) { $("#dock").hidden = h; $("#peek").hidden = !h; if (h) toggleSheet(false); }

$("#prev").onclick = () => go(-1);
$("#next").onclick = () => go(1);
$("#cur").onclick = () => toggleSheet();
$("#list").onclick = e => { const b = e.target.closest(".item"); if (!b) return; state.opt = b.dataset.id; if (state.cmp === state.opt) state.cmp = ""; render(); toggleSheet(false); };
$("#page").onchange = e => { state.page = e.target.value; render(); };
$("#dev").onclick = e => { const b = e.target.closest("button"); if (b) { state.dev = b.dataset.v; render(); } };
$("#cmp").onchange = e => { state.cmp = e.target.value; render(); };
$("#hide").onclick = () => setHidden(true);
$("#peek").onclick = () => setHidden(false);
document.addEventListener("pointerdown", e => { if (!$("#sheet").hidden && !e.target.closest(".dock")) toggleSheet(false); });

function onKey(e) {
  if (e.target.closest && e.target.closest("select, input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (/^[0-9]$/.test(e.key)) { const i = (+e.key + 9) % 10; if (!OPTS[i]) return; state.opt = OPTS[i].id; if (state.cmp === state.opt) state.cmp = ""; render(); }
  else if (e.key === "h" || e.key === "H") setHidden(!$("#dock").hidden);
  else if (e.key === "Escape") toggleSheet(false);
  else return;
  e.preventDefault();
}
addEventListener("keydown", onKey);
// Keys pressed while the page inside has focus still switch styles.
document.getElementById("stage").addEventListener("load", e => { try { e.target.contentWindow.addEventListener("keydown", onKey); } catch {} }, true);
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== state.opt && OPTS.some(o => o.id === h)) { state.opt = h; render(); } });
new ResizeObserver(() => { fit(); }).observe($("#stage"));
addEventListener("resize", () => render());
render();
</script>
