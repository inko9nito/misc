<body>
<title>Surgery Supplement Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column. Surgery countdown, week strip of progress rings, the day's to-do and done lists grouped by dose time, and a bottom bar for Today / Supplements / Progress. */
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --band:#FAF9F6; --line:#ECE9E2; --ink:#1E1E1B; --ink2:#4A4843; --muted:#6E6B63;
  --track:#E6E3DB; --chk:#949086; --tile:#F1EFE9;
  --accent:#5F9C74; --accent-ink:#3D7552; --accent-tint:#E4EEE6; --on-accent:#FFFFFF;
  --special:#B4651F; --special-tint:#F5E4D2;
  --font:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --card:#1F1F1C; --band:#232320; --line:#2F2E2A; --ink:#F2F0EB; --ink2:#D2CFC7; --muted:#A3A097;
    --track:#36352F; --chk:#6E6C64; --tile:#2A2926;
    --accent:#7DBE92; --accent-ink:#93CFA6; --accent-tint:#203327; --on-accent:#10140F;
    --special:#E9A564; --special-tint:#3B2A1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --card:#1F1F1C; --band:#232320; --line:#2F2E2A; --ink:#F2F0EB; --ink2:#D2CFC7; --muted:#A3A097;
  --track:#36352F; --chk:#6E6C64; --tile:#2A2926;
  --accent:#7DBE92; --accent-ink:#93CFA6; --accent-tint:#203327; --on-accent:#10140F;
  --special:#E9A564; --special-tint:#3B2A1A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(84px + env(safe-area-inset-bottom,0px))}

/* Countdown */
.cd{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.cd .tile{background:var(--accent-tint);color:var(--accent-ink)}
.cd-t{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cd-n{font-size:22px;font-weight:800;line-height:1.1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.cd-l{font-size:15px;font-weight:600}
.cd-s{font-size:13px;color:var(--muted);margin-top:1px}

/* Week strip */
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:10px}
.strip::-webkit-scrollbar{display:none}
.week{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.d{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 6px;border-radius:16px;text-align:center}
.d .wd{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.d.today .wd{color:var(--accent-ink)}
.d[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d[aria-pressed="true"] .wd{color:var(--ink);font-weight:800}
.d[aria-pressed="true"] .n{font-weight:800}
.ring{position:relative;width:34px;height:34px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--track);stroke-width:3}
.ring .p{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .25s}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mk{height:12px;display:grid;place-items:center;color:var(--special)}
.mk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.d.sp .ring .t{stroke:var(--special-tint)}
.d.sp .ring .p{stroke:var(--special)}
.d.sp .n{color:var(--special);font-weight:800}
.dots{display:flex;justify-content:center;gap:5px;margin-top:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--muted)}

/* Day summary */
.dateline{margin-top:12px;font-size:15px;color:var(--muted)}
.dateline b{font-weight:600;color:var(--special)}
.counter{display:flex;align-items:baseline;gap:8px;margin-top:2px;flex-wrap:wrap}
.big{font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.of{font-size:30px;font-weight:600;line-height:1.15;color:var(--track);font-variant-numeric:tabular-nums}
.of b{color:var(--muted);font-weight:600}
.lbl{font-size:15px;color:var(--muted)}

.sec{display:flex;gap:8px;align-items:baseline;margin:20px 2px 8px;font-size:16px;font-weight:600}
.sec span{color:var(--muted);font-weight:500}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.band{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 14px;background:var(--band);font-size:12px;font-weight:700;color:var(--muted)}
.band span{font-weight:500}
/* A row is two targets: .open (tile and text) shows details; .tick (the circle) marks it taken. */
.item{display:flex;align-items:stretch;width:100%;min-height:64px}
.open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0 10px 14px}
.open:last-child{padding-right:14px}
.open:active,.tick:active{background:var(--band)}
.tick{flex:none;width:52px;display:grid;place-items:center}
.tile{flex:none;width:42px;height:42px;border-radius:12px;background:var(--tile);display:grid;place-items:center;color:var(--ink2)}
.tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile{overflow:hidden}
.tile img{display:block;width:auto;height:auto;max-width:34px;max-height:37px;object-fit:contain}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{font-size:15px;font-weight:500;line-height:1.25}
.sb{font-size:14px;color:var(--muted)}
.pill{align-self:flex-start;margin-top:5px;font-size:12px;font-weight:600;color:var(--ink2);border:1.5px solid var(--line);border-radius:999px;padding:2px 9px}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--chk);display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.chk svg{width:13px;height:13px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .chk{background:var(--accent);border-color:var(--accent)}
.item.done .chk svg{opacity:1}
.item.done .nm{color:var(--muted)}
.open:focus-visible,.tick:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:12px}
.empty{display:flex;align-items:center;gap:10px;padding:16px 14px;color:var(--muted)}
.empty .chk{background:var(--accent);border-color:var(--accent)}
.empty .chk svg{opacity:1}

/* Other views */
.vt{margin:12px 2px 0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.grp{margin-top:20px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 2px 8px}
.gh b{font-size:16px;font-weight:700}
.gh span{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.gh.sp b,.gh.sp span{color:var(--special)}
.foot{margin:14px 4px 0;font-size:13px;line-height:1.5;color:var(--muted)}

.cal{padding:12px 8px 8px}
.cal-h,.cal-r{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;justify-items:center}
.cal-h span{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cal-c{margin:10px 6px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.cal-r .d{padding:4px 0 2px;gap:2px;width:100%}
.cal-r .ring{width:32px;height:32px}
.cal-r .ring .n{font-size:13px}
.cal-r .d.today .n{color:var(--accent-ink);font-weight:800}
.sync{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.bar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600;text-align:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink)}

/* Details page: pushed in from the right, as the HPDE app's event page is. The page under it
   slides 30% left and dims 10%, along iOS's push spring (500 ms, sampled into linear()). */
:root{--push-ease:cubic-bezier(.32,.6,.05,.98);--push-ease:linear(0, 0.0148, 0.0527, 0.1054, 0.167, 0.233, 0.3002, 0.3664, 0.4301, 0.4901, 0.546, 0.5975, 0.6445, 0.687, 0.7252, 0.7594, 0.7898, 0.8168, 0.8407, 0.8617, 0.8801, 0.8962, 0.9103, 0.9226, 0.9333, 0.9425, 0.9506, 0.9575, 0.9635, 0.9687, 0.9732, 0.9771, 0.9804, 0.9832, 0.9857, 0.9878, 0.9896, 0.9911, 0.9924, 0.9935, 0.9945, 0.9953, 0.996, 0.9966, 0.9971, 0.9976, 0.9979, 0.9982, 0.9985, 0.9987, 0.9989)}
.wrap,.bar{transition:transform 500ms var(--push-ease)}
html.push-open .wrap,html.push-open .bar{transform:translateX(-30%)}
.push-dim{position:fixed;inset:0;z-index:39;background:#000;opacity:0;pointer-events:none;transition:opacity 500ms var(--push-ease)}
html.push-open .push-dim{opacity:.1}
.push{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  transform:translateX(100%);transition:transform 500ms var(--push-ease);box-shadow:-8px 0 32px -8px rgba(0,0,0,.18)}
.push.on{transform:none}
.push:focus{outline:none}
.push-in{min-height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.push-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  padding:env(safe-area-inset-top,0px) max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));min-height:calc(48px + env(safe-area-inset-top,0px));
  background:var(--bg);border-bottom:1px solid transparent;transition:border-color .15s}
.push-h.scrolled{border-bottom-color:var(--line)}
.back{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--accent-ink)}
.back svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.push-ht{text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.push-h.scrolled .push-ht{opacity:1;transform:none}
.push-b{padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.push-foot{position:sticky;bottom:0;margin-top:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.sh-img{height:168px;border-radius:16px;background:var(--tile);display:grid;place-items:center;color:var(--ink2)}
.sh-img img{display:block;max-height:140px;max-width:70%;width:auto;height:auto}
.sh-img svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.sh-t{margin:14px 2px 0;font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.sh-b{margin:2px 2px 0;font-size:14px;color:var(--muted)}
.kv{display:flex;gap:12px;padding:11px 14px;font-size:15px}
.kv .k{flex:none;width:64px;font-size:13px;font-weight:600;color:var(--muted);padding-top:1px}
.kv .v{flex:1;min-width:0}
.sh-btn{display:block;width:100%;min-height:50px;border-radius:14px;font-size:16px;font-weight:600;text-align:center;background:var(--accent);color:var(--on-accent)}
.sh-btn.undo{background:var(--card);color:var(--ink);border:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){ .ring .p,.chk,.wrap,.bar,.push,.push-dim{transition:none} }
</style>

<div class="wrap">
  <section id="v-today" aria-label="Today">
    <div id="cd"></div>
    <div class="strip" id="strip" aria-label="Choose a day"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div id="day"></div>
  </section>
  <section id="v-supps" aria-label="Supplements" hidden></section>
  <section id="v-progress" aria-label="Progress" hidden></section>
</div>

<nav class="bar" aria-label="Views">
  <div class="bar-in">
    <button type="button" class="tab" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Today
    </button>
    <button type="button" class="tab" data-view="supps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/></svg>Supplements

  function itemsFor(n) {
    if (n < NIGHT_N) return BEFORE;

  function phaseOf(n) {
    if (n < NIGHT_N) return "Prep day " + (n + 1) + " of 14";

  const special = (n) => n === NIGHT_N || n === SURG_N;

  /* ---------- State ---------- */
  const LS = "surgery-tracker-v2";
  let state = (function () { try { const v = JSON.parse(localStorage.getItem(LS) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; } })();
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };
  const key = (n, it) => iso(dateOf(n)) + ":" + it.id;

  /* ---------- Countdown ---------- */

      '<div class="cd-s">' + sub + '</div></div></div>';

  /* ---------- Rings ---------- */

      '<circle class="p" data-c="' + C.toFixed(2) + '" cx="' + c + '" cy="' + c + '" r="' + r + '" stroke-dasharray="' + (p * C).toFixed(2) + ' ' + C.toFixed(2) + '"' + (p === 0 ? ' style="opacity:0"' : '') + '/>' +

    for (let w = 0; w < DAYS / 7; w++) {

  /* ---------- Details page (pushed from the right) ---------- */
  const push = document.getElementById("push");
  const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  let detailFor = null, detailRoute = "", opener = null;   // detailFor: { k, n } when opened from a day
  const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  function toggle(k, n) {

    saveLocal(); queueSync();
    renderDay(); updateRings(n);
  }
  function detailHTML(row, dayCtx) {
    const d = DETAILS[row.name] || {};
    const kv = (k, v) => v ? '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>' : "";
    const img = row.img && IMG_L[row.img] ? '<img src="' + IMG_L[row.img] + '" alt="">' : svg(row.icon);
    const rows = (dayCtx ? kv("Today", row.sub) + kv("When", row.slot === "Also today" ? "" : row.slot) : kv("Schedule", row.sub)) +
      kv("How", d.how) + kv("Label", d.label) + kv("Why", d.why) + kv("Note", [row.pill, d.note].filter(Boolean).join(". "));
    const foot = dayCtx ? '<div class="push-foot"><button type="button" class="sh-btn' + (on(dayCtx.k) ? ' undo' : '') + '" data-mark>' +

      '<div class="push-ht" aria-hidden="true">' + row.name + '</div><span></span></div>' +
      '<div class="push-b"><div class="sh-img">' + img + '</div><h2 class="sh-t" id="sh-t">' + row.name + '</h2>' +
      (d.brand ? '<p class="sh-b">' + d.brand + '</p>' : '') +

  // iOS Safari ignores overflow:hidden on the page, so pin the body in place while the details page is open.
  let lockY = 0;
  function lockScroll() {

    Object.assign(document.body.style, { position: "fixed", top: (padTop - lockY) + "px", left: "0", right: "0", width: "100%" });
  }
  function unlockScroll() {

  }

  // Each details page is its own history entry (#d/<day>/<id> or #s/<row>), as the HPDE app's pages
  // are: Safari's swipe back then slides the list back in by itself, and Back steps back through history.
  // Inside claude.ai's frame there's no history to use, so it just opens and closes.
  const useHistory = !inFrame;
  function routeOf(row, dayCtx) {
    if (dayCtx) return "#d/" + dayCtx.n + "/" + dayCtx.k.split(":")[1];
    const i = suppRows.indexOf(row);
    return i >= 0 ? "#s/" + i : "";
  }
  function fromRoute(hash) {
    let m = /^#d\/(\d+)\/([\w-]+)$/.exec(hash);
    if (m) {

      return it ? { row: it, dayCtx: { k: key(n, it), n: n } } : null;

    m = /^#s\/(\d+)$/.exec(hash);
    return m && suppRows[+m[1]] ? { row: suppRows[+m[1]], dayCtx: null } : null;
  }

  // instant: the browser already slid the pages across itself (a swipe back or forward), so

    const els = [push, dim].concat(under());

    if (instant) instantly(go); else go();

    if (instant) finishClose(); else setTimeout(finishClose, 520);
    // Hand focus back for keyboard users only; after a tap it would leave a focus ring on the row.
    if (back && !back.isConnected && ctx) back = document.querySelector('.open[data-k="' + ctx.k + '"]');
    if (usingKeys && back && back.isConnected) back.focus({ preventScroll: true });

    if (push.classList.contains("on")) return;
    push.hidden = true; push.innerHTML = "";
  }
  function openDetail(row, dayCtx, from) {

  }

  const under = () => [document.querySelector(".wrap"), document.querySelector(".bar")];
  const dim = document.querySelector(".push-dim");

  let usingKeys = false;
  document.addEventListener("pointerdown", () => { usingKeys = false; }, true);
  document.addEventListener("keydown", (e) => { usingKeys = true; if (e.key === "Escape") closeDetail(); });

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-back]")) { closeDetail(); return; }
    if (e.target.closest("[data-mark]")) { if (detailFor) toggle(detailFor.k, detailFor.n); closeDetail(); return; }
    const t = e.target.closest(".tab, .tick, .open, .d");
    if (!t) return;
    if (t.classList.contains("tab")) { showView(t.dataset.view); return; }
    if (t.classList.contains("tick")) {
      const k = t.dataset.k, hadFocus = document.activeElement === t;
      toggle(k, +t.dataset.n);

    if (t.classList.contains("open")) {

      const n = +t.dataset.n, k = t.dataset.k, it = itemsFor(n).find((x) => key(n, x) === k);

    selectDay(+t.dataset.n);
  });

  /* ---------- Sync across devices (db capability; falls back to this device) ---------- */
  let ref = null, synced = false, timer = null, pending = false;
  const early = {};
  function queueSync() {
    if (!ref) return;
    pending = true;
    clearTimeout(timer);
    timer = setTimeout(() => flush(false), 400);
  }
  async function flush(retried) {
    if (!ref) return;
    try { await ref.set(Object.assign({}, state)); pending = false; setSync("Checkmarks sync across your devices."); }
    catch (err) {
      if (err && err.code === "unavailable" && !retried) { setTimeout(() => flush(true), 600 + Math.random() * 900); return; }
      pending = false; setSync("Couldn’t sync just now. Checkmarks are saved on this device.");
    }
  }
  const clean = (o) => { const out = {}; if (o) Object.keys(o).forEach((k) => { if (o[k] === true) out[k] = true; }); return out; };
  function refreshAll() {
    for (let n = 0; n < DAYS; n++) updateRings(n);
    renderDay();
    if (view === "progress") renderProgress();
  }
  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return;
    try { ref = db.doc("tracker/state"); } catch (e) { ref = null; return; }
    ref.onSnapshot((snap) => {
      const remote = snap.exists ? clean(snap.data()) : null;
      if (!synced) {
        synced = true;
        state = remote || clean(state);
        Object.keys(early).forEach((k) => { if (early[k]) state[k] = true; else delete state[k]; });
        saveLocal(); refreshAll();
        setSync("Checkmarks sync across your devices.");
        if (!remote || Object.keys(early).length) queueSync();
        return;
      }
      if (pending) return;
      state = remote || {};
      saveLocal(); refreshAll();
    }, () => { ref = null; setSync("Checkmarks are saved on this device."); });
  }

  renderCountdown();
  renderStrip();
  renderDay();
  requestAnimationFrame(showWeek);
  connect();
})();
</script>

</body>
</html>
